name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - run: ./gradlew ktlintCheck

  jvm:
    name: JVM tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - run: ./gradlew :tassel-core:jvmTest :tassel-cli:test :tassel-app:desktopTest koverXmlReport koverHtmlReport
      - name: Coverage summary
        run: |
          grep -oE '<counter type="(LINE|INSTRUCTION)" missed="[0-9]+" covered="[0-9]+"/>' build/reports/kover/report.xml \
            | tail -2 \
            | sed -E 's/<counter type="([A-Z]+)" missed="([0-9]+)" covered="([0-9]+)"\/>/\1 \2 \3/' \
            | awk 'BEGIN { print "| Counter | Covered | Total |"; print "|---|---|---|" }
                   { printf "| %s | %d | %d |\n", $1, $3, $2 + $3 }' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: build/reports/kover/

  wasm-js:
    name: Wasm (Node) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - run: ./gradlew :tassel-core:wasmJsNodeTest :tassel-app:compileProductionExecutableKotlinWasmJs

  linux-x64:
    name: Linux x64 native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :tassel-core:linuxX64Test

  macos-arm64:
    name: macOS arm64 native tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :tassel-core:macosArm64Test
