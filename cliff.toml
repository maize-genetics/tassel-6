# git-cliff configuration for TASSEL 6 (ADR-0010).
#
# Generate the changelog for a release from the release branch:
#
#   git cliff --tag 6.0.0-poc.1 --output CHANGELOG.md
#
# Sections follow the Conventional Commit types the PR-title check accepts. Scopes (core, cli,
# app, server, bridge, bindings, testdata, docs, adr, build, ci) are kept in the entry text
# rather than used for grouping, because a reader wants to know what changed before where.

[changelog]
header = """
# Changelog

All notable changes to TASSEL 6. Generated by [git-cliff](https://git-cliff.org) from the commit
history; the format follows [Conventional Commits](https://www.conventionalcommits.org) and the
versions follow [Semantic Versioning](https://semver.org).\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# git-cliff warns that it skipped a few commits; those are the seven from before the convention was
# adopted ("Initial commit", "Add license", and so on). Nothing after ADR-0010 is dropped.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

# A merge commit says which branch merged, not what changed; the squashed commit under it already
# says that. Rewriting it to a skipped type drops it without the "unconventional commit" warning.
commit_preprocessors = [
  { pattern = '^Merge (pull request|branch|remote-tracking).*', replace = "chore: merge" },
]

# The hidden numbers order the sections; the body template strips them back out.
commit_parsers = [
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^refactor", group = "<!-- 04 -->Refactoring" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^docs", group = "<!-- 06 -->Documentation" },
  { message = "^build", group = "<!-- 07 -->Build" },
  { message = "^ci", group = "<!-- 08 -->Continuous integration" },
  { message = "^revert", group = "<!-- 09 -->Reverts" },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
